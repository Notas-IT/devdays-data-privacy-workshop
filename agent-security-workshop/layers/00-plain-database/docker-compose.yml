# Cumulative reference stage 0: Plain database
name: devdays-agent-layer-00

services:
  setup:
    image: devdays-agent-layer-runtime
    build:
      context: ../..
      dockerfile: layer_runtime/Dockerfile
    profiles: [tools]
    environment:
      STAGE_LEVEL: "0"
    volumes:
      - admin_state:/state
      - db_secret:/db-secret
      - gateway_config:/gateway-config
      - agent_config:/agent-config
      - broker_config:/broker-config
      - ./security.sql:/stage/security.sql:ro
    networks: [db_net]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD_FILE: /run/db-secret/password
    volumes:
      - db_secret:/run/db-secret:ro
      - postgres_data:/var/lib/postgresql/data
    networks: [agent_net, db_net]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_admin -d agent_lab"]
      interval: 2s
      timeout: 3s
      retries: 20

  agent:
    image: devdays-agent-layer-agent
    build:
      context: ../..
      dockerfile: layer_runtime/agent.Dockerfile
    user: "0:0"
    read_only: false
    init: true
    environment:
      HOME: /home/agent
      CODEX_HOME: /home/agent/.codex
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
      - /home/agent:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=700
    volumes:
      - agent_config:/run/agent:ro
      - ../../README.md:/host-workshop/README.md:ro
    networks: [agent_net]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    depends_on:
      db:
        condition: service_healthy

networks:
  agent_net:
    internal: true
  db_net:
    internal: true

volumes:
  admin_state:
  db_secret:
  gateway_config:
  agent_config:
  broker_config:
  postgres_data:
