name: devdays-database-student-workshop

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: privacy_workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - .:/workshop
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d privacy_workshop"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
