  <text x="714.5" y="59.15" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="bold">1. Docker logs → script → Presidio → file</text>
  <text x="733.0" y="112.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Proposed streaming demo · redacted file + separate 28-day raw archive</text>
  <text x="63" y="194.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">LOCAL DOCKER DEMO</text>
  <text x="122" y="267.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">HR service</text>
  <text x="122" y="303.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes logs</text>
  <text x="122" y="329.03000000000003" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">stdout / stderr or a log file</text>
  <text x="622" y="267.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Billing service</text>
  <text x="622" y="303.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes logs</text>
  <text x="622" y="329.03000000000003" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">stdout / stderr or a log file</text>
  <text x="1122" y="267.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">API service</text>
  <text x="1122" y="303.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes logs</text>
  <text x="1122" y="329.03000000000003" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">stdout / stderr or a log file</text>
  <text x="457" y="482.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">2. COLLECTOR SCRIPT · COPY FIRST</text>
  <text x="457" y="518.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Keep the original for the forensic archive.</text>
  <text x="457" y="544.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Send a separate working copy to Presidio.</text>
  <text x="348" y="674.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">3. LOCAL PRESIDIO PROCESSING</text>
  <text x="457" y="742.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Analyzer · detect possible PII</text>
  <text x="457" y="778.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Uses recognizers, patterns and an NLP model.</text>
  <text x="457" y="907.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Anonymizer · redact detected values</text>
  <text x="457" y="943.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Replace detected spans with placeholders.</text>
  <text x="457" y="1142.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">4. REDACTED OUTPUT FILE</text>
  <text x="457" y="1178.4099999999999" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Append processed records to redacted-logs.jsonl.</text>
  <text x="1508" y="474.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">FORENSIC ARCHIVE · restricted</text>
  <text x="1552" y="642.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC LOKI · RAW ORIGINALS</text>
  <text x="1552" y="678.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">All collected streams, before redaction.</text>
  <text x="1552" y="704.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Retention target: 28 days (672 hours).</text>
  <text x="1552" y="729.65" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Separate persistent storage.</text>
  <text x="1552" y="897.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC GRAFANA</text>
  <text x="1552" y="933.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Restricted investigator access.</text>
  <text x="1552" y="959.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Queries the raw archive.</text>
  <text x="1552" y="1095.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">RETENTION AND ACCESS</text>
  <text x="1552" y="1130.18" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Loki retention + Compactor.</text>
  <text x="1552" y="1154.5800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Grafana only queries the archive.</text>
  <text x="1552" y="1178.9800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Normal users have no archive access.</text>
  <rect x="1490" y="535" width="600" height="55" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="1673.5" y="559.7" fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Untouched original copy</text>
  <text x="107" y="1407.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Two intentional streams: raw forensics and a redacted working output.</text>
  <text x="107" y="1444.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Amber = raw originals; green = redacted output. The raw archive is separate and restricted. Detectors can miss personal data.</text>
