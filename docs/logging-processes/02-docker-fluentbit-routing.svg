  <text x="646.5" y="59.15" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="bold">2. Fluent Bit regex routing + separate forensic archive</text>
  <text x="726.5" y="112.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Proposed design · regex and Lua inside Fluent Bit; Presidio handles the NLP route</text>
  <text x="63" y="184.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">DOCKER HOST · two separate log stores and viewers</text>
  <text x="172" y="247.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">HR service</text>
  <text x="172" y="283.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="672" y="247.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Billing service</text>
  <text x="672" y="283.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="1172" y="247.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">API service</text>
  <text x="1172" y="283.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="148" y="444.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">FLUENT BIT · collector, routing and Lua filters</text>
  <text x="272" y="512.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">1. COPY THE ORIGINAL BEFORE MUTATING ANY FIELDS</text>
  <text x="272" y="549.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">rewrite_tag keeps raw.* untouched and emits a work.* copy. Parse application JSON only on the working copy.</text>
  <text x="522" y="713.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">2. REGEX CLASSIFICATION · rewrite_tag</text>
  <text x="522" y="750.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Simple PII match in a supported structured format?</text>
  <text x="522" y="777.2900000000001" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Unknown formats and non-matches go to Presidio.</text>
  <text x="202" y="942.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">3A. LUA · FAST REDACTION</text>
  <text x="202" y="979.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Mask the matched fields.</text>
  <text x="202" y="1006.1" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Drop unknown fields and remaining free text.</text>
  <text x="202" y="1032.94" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Export approved fields under redacted.*.</text>
  <text x="1022" y="942.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">3B. HTTP OUTPUT · NEEDS NLP</text>
  <text x="1022" y="979.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Send the working record to the Presidio</text>
  <text x="1022" y="1006.1" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">adapter.</text>
  <text x="1022" y="1032.94" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">A regex miss does not mean “safe”.</text>
  <text x="982" y="1228.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">4. PRESIDIO ADAPTER · HTTP SERVICE</text>
  <text x="982" y="1265.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Calls Analyzer + Anonymizer.</text>
  <text x="982" y="1292.29" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Emits a redacted record to normal Loki.</text>
  <text x="982" y="1319.1299999999999" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Failure: retry or drop; no raw fallback.</text>
  <text x="402" y="1508.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">OPERATIONAL LOKI · REDACTED LOGS</text>
  <text x="402" y="1545.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Receives fast-path output and Presidio output.</text>
  <text x="402" y="1572.29" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Separate storage from the raw forensic archive.</text>
  <text x="402" y="1693.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">NORMAL GRAFANA</text>
  <text x="402" y="1730.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Normal users query redacted logs only.</text>
  <text x="1648" y="444.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">FORENSIC ARCHIVE · restricted</text>
  <text x="1692" y="687.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC LOKI · RAW ORIGINALS</text>
  <text x="1692" y="723.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">All collected streams, before redaction.</text>
  <text x="1692" y="749.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Retention target: 28 days (672 hours).</text>
  <text x="1692" y="774.65" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Separate persistent storage.</text>
  <text x="1692" y="942.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC GRAFANA</text>
  <text x="1692" y="978.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Restricted investigator access.</text>
  <text x="1692" y="1004.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Queries the raw archive.</text>
  <text x="1692" y="1140.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">RETENTION AND ACCESS</text>
  <text x="1692" y="1175.18" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Loki enforces retention; Grafana only queries.</text>
  <text x="1692" y="1199.5800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Enable the Compactor and persist its state.</text>
  <text x="1692" y="1223.9800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Normal Grafana does not connect here.</text>
  <text x="1692" y="1248.3800000000003" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Deletion runs asynchronously.</text>
  <rect x="350" y="810" width="400" height="38" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="401.5" y="833.0" fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Supported regex match → redact</text>
  <rect x="1000" y="810" width="450" height="38" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="1066.5" y="833.0" fill="#8b5cf6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">No match / unknown format → NLP</text>
  <rect x="1620" y="545" width="600" height="70" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="1724.5" y="569.7" fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Original copy · before parsing / redaction</text>
  <text x="97" y="1893.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">No record is declared safe just because a regex did not match.</text>
  <text x="97" y="1931.3" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal">The fast path emits only approved fields and discards other text. To retain arbitrary free text, run it through Presidio too. Raw copies go to the restricted forensic archive before redaction. Normal Grafana</text>
  <text x="97" y="1959.36" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal">never queries that archive.</text>
</svg>