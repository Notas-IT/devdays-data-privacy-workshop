  <text x="707.5" y="59.15" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="bold">3. Single-node Kubernetes · redacted logs + raw forensics</text>
  <text x="862.0" y="112.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">One data center → one cluster → one node · one Fluent Bit DaemonSet Pod</text>
  <text x="43" y="191.8" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold">DATA CENTER A</text>
  <text x="83" y="265.95" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold">KUBERNETES CLUSTER A</text>
  <text x="123" y="339.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">NODE 1 · single-node cluster; control-plane components omitted</text>
  <text x="272" y="497.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">HR application Pod</text>
  <text x="272" y="533.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="772" y="497.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">Billing application Pod</text>
  <text x="772" y="533.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="1272" y="497.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">API application Pod</text>
  <text x="1272" y="533.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Continuously writes stdout / stderr.</text>
  <text x="248" y="694.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">FLUENT BIT POD · DaemonSet collector and filters</text>
  <text x="372" y="762.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">1. COPY THE ORIGINAL BEFORE MUTATING ANY FIELDS</text>
  <text x="372" y="799.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">rewrite_tag keeps raw.* untouched and emits a work.* copy. Parse application JSON only on the working copy.</text>
  <text x="622" y="963.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">2. REGEX CLASSIFICATION · rewrite_tag</text>
  <text x="622" y="1000.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Simple PII match in a supported structured format?</text>
  <text x="622" y="1027.29" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Unknown formats and non-matches go to Presidio.</text>
  <text x="302" y="1192.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">3A. LUA · FAST REDACTION</text>
  <text x="302" y="1229.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Mask the matched fields.</text>
  <text x="302" y="1256.1" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Drop unknown fields and remaining free text.</text>
  <text x="302" y="1282.9399999999998" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Export approved fields under redacted.*.</text>
  <text x="1122" y="1192.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">3B. HTTP OUTPUT · NEEDS NLP</text>
  <text x="1122" y="1229.26" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Send the working record to the Presidio</text>
  <text x="1122" y="1256.1" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">adapter.</text>
  <text x="1122" y="1282.9399999999998" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">A regex miss does not mean “safe”.</text>
  <text x="1082" y="1478.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">4. PRESIDIO ADAPTER POD · Deployment</text>
  <text x="1082" y="1515.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Calls Analyzer + Anonymizer.</text>
  <text x="1082" y="1542.29" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Emits a redacted record to normal Loki.</text>
  <text x="1082" y="1569.1299999999999" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Failure: retry or drop; no raw fallback.</text>
  <text x="502" y="1758.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">OPERATIONAL LOKI · REDACTED LOGS</text>
  <text x="502" y="1795.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Receives fast-path output and Presidio output.</text>
  <text x="502" y="1822.29" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Separate storage from the raw forensic archive.</text>
  <text x="502" y="1943.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">NORMAL GRAFANA</text>
  <text x="502" y="1980.45" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Normal users query redacted logs only.</text>
  <text x="1748" y="694.25" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold">FORENSIC ARCHIVE · restricted</text>
  <text x="1792" y="937.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC LOKI · RAW ORIGINALS</text>
  <text x="1792" y="973.41" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">All collected streams, before redaction.</text>
  <text x="1792" y="999.03" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Retention target: 28 days (672 hours).</text>
  <text x="1792" y="1024.6499999999999" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Separate persistent storage.</text>
  <text x="1792" y="1192.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">FORENSIC GRAFANA</text>
  <text x="1792" y="1228.4099999999999" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Restricted investigator access.</text>
  <text x="1792" y="1254.0299999999997" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal">Queries the raw archive.</text>
  <text x="1792" y="1390.7" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">RETENTION AND ACCESS</text>
  <text x="1792" y="1425.18" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Loki enforces retention; Grafana only queries.</text>
  <text x="1792" y="1449.5800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Enable the Compactor and persist its state.</text>
  <text x="1792" y="1473.9800000000002" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Normal Grafana does not connect here.</text>
  <text x="1792" y="1498.3800000000003" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Deletion runs asynchronously.</text>
  <rect x="450" y="1060" width="400" height="38" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="501.5" y="1083.0" fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">Supported regex match → redact</text>
  <rect x="1100" y="1060" width="450" height="38" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="1166.5" y="1083.0" fill="#8b5cf6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal">No match / unknown format → NLP</text>
  <rect x="1720" y="795" width="600" height="70" rx="12" fill="#ffffff" stroke="none" stroke-width="2" />
  <text x="1824.5" y="819.7" fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal">Original copy · before parsing / redaction</text>
  <text x="157" y="2152.4" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">All shown components run as Pods on this node. Operational and forensic Loki use separate persistent storage and separate Grafana views.</text>
  <text x="92" y="2366.55" fill="#142e50" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal">Teaching setup: one node provides no node redundancy. The raw archive retains original collected records for a 28-day policy window.</text>
</svg>