name: devdays-log-pipeline-workshop

x-runtime: &runtime
  image: devdays-log-pipeline-student
  build:
    context: ..
    dockerfile: log-pipeline-workshop/Dockerfile

services:
  app-hr:
    <<: *runtime
    profiles: ["pipeline"]
    environment:
      APP_SERVICE: hr
      LOG_INTERVAL_SECONDS: ${LOG_INTERVAL_SECONDS:-2}
    volumes:
      - hr_raw:/raw

  app-billing:
    <<: *runtime
    profiles: ["pipeline"]
    environment:
      APP_SERVICE: billing
      LOG_INTERVAL_SECONDS: ${LOG_INTERVAL_SECONDS:-2}
    volumes:
      - billing_raw:/raw

  processor:
    <<: *runtime
    profiles: ["exercise"]
    command: ["python", "starter.py"]
    volumes:
      - hr_raw:/raw/hr:ro
      - billing_raw:/raw/billing:ro
      - .:/app

volumes:
  hr_raw:
  billing_raw:
