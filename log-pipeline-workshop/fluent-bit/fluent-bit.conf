[SERVICE]
    Flush          1
    Grace          5
    Log_Level      warn
    Parsers_File   /fluent-bit/workshop/parsers.conf
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      8080
    Health_Check   On

[INPUT]
    Name              tail
    Alias             raw_hr
    Tag               app.hr
    Path              /raw/hr/app.jsonl
    Parser            workshop_json
    DB                /state/hr.db
    DB.Sync           Normal
    Read_From_Head    On
    Refresh_Interval  1
    Rotate_Wait       5
    Buffer_Max_Size   256k
    Skip_Long_Lines   On
    Mem_Buf_Limit     5M

[INPUT]
    Name              tail
    Alias             raw_billing
    Tag               app.billing
    Path              /raw/billing/app.jsonl
    Parser            workshop_json
    DB                /state/billing.db
    DB.Sync           Normal
    Read_From_Head    On
    Refresh_Interval  1
    Rotate_Wait       5
    Buffer_Max_Size   256k
    Skip_Long_Lines   On
    Mem_Buf_Limit     5M

@INCLUDE /fluent-bit/workshop/privacy-filters.conf

[OUTPUT]
    Name                   loki
    Alias                  sanitized_hr
    Match                  app.hr
    Host                   log-loki
    Port                   3100
    Labels                 workshop=log-pipeline,namespace=privacy-demo,service=hr,collector=fluent-bit
    Auto_Kubernetes_Labels Off
    Line_Format            json
    Retry_Limit            False

[OUTPUT]
    Name                   loki
    Alias                  sanitized_billing
    Match                  app.billing
    Host                   log-loki
    Port                   3100
    Labels                 workshop=log-pipeline,namespace=privacy-demo,service=billing,collector=fluent-bit
    Auto_Kubernetes_Labels Off
    Line_Format            json
    Retry_Limit            False
