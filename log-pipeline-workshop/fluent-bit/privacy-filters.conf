# Remove any forged success marker before running the privacy filter.
[FILTER]
    Name   modify
    Match  app.*
    Remove pipeline_guard

[FILTER]
    Name           lua
    Alias          privacy_rules
    Match          app.*
    Script         ${PRIVACY_SCRIPT}
    Call           sanitize
    Protected_Mode On

# Even an unexpected Lua runtime error must not forward the original record.
[FILTER]
    Name  grep
    Alias sanitized_only
    Match app.*
    Regex pipeline_guard ^sanitized-v1$

[FILTER]
    Name   modify
    Match  app.*
    Remove pipeline_guard
