[SERVICE]
    Flush          1
    Grace          5
    Log_Level      error
    Parsers_File   /pipeline/parsers.conf
    storage.path   /buffers/chunks

[INPUT]
    Name              tail
    Tag               input.hr
    Path              /raw/hr/app.jsonl
    Parser            workshop_json
    DB                /buffers/hr.db
    Read_From_Head    On
    Refresh_Interval  1
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               input.billing
    Path              /raw/billing/app.jsonl
    Parser            workshop_json
    DB                /buffers/billing.db
    Read_From_Head    On
    Refresh_Interval  1
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

# Incoming data cannot supply its own trusted classification.
[FILTER]
    Name       modify
    Match      input.*
    Remove     regex_status
    Remove     _route

[FILTER]
    Name          parser
    Match         input.*
    Key_Name      message
    Parser        known_lithuanian_message
    Reserve_Data  On
    Preserve_Key  On

# Regex output is projected to safe metadata here; unmatched records stay private.
[FILTER]
    Name          lua
    Match         input.*
    Script        /pipeline/route.lua
    Call          route
    Type_Int_Key  sequence

[FILTER]
    Name                  rewrite_tag
    Match                 input.*
    Rule                  $_route ^regex$ safe.regex false
    Rule                  $_route ^presidio$ fallback.presidio false
    Emitter_Name          workshop_routes
    Emitter_Storage.type  filesystem

[FILTER]
    Name    modify
    Match   safe.*
    Remove  _route

[OUTPUT]
    Name    stdout
    Match   safe.regex
    Format  json_lines

# Raw unmatched logs have exactly one destination. Never print them to stdout.
[OUTPUT]
    Name                      http
    Match                     fallback.presidio
    Host                      log-presidio
    Port                      8080
    URI                       /sanitize
    Format                    json_lines
    Json_Date_Key             false
    Retry_Limit               False
    storage.total_limit_size  64M
    net.connect_timeout       5
    net.io_timeout            30
