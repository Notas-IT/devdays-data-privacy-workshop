[PARSER]
    Name    workshop_json
    Format  json

# Full format match. Sensitive substrings are consumed, never captured.
[PARSER]
    Name    known_lithuanian_message
    Format  regex
    Regex   \AAnketa: darbuotojas=[^;\r\n]+; asmens_kodas=[0-9]{11}; telefonas=[0-9 +()-]+; adresas=[^;\r\n]+; el_pastas: [^; @\r\n]+@[^; @\r\n]+; atlyginimas=[0-9]+ EUR; būsena=(?<regex_status>gerai|klaida)\z
