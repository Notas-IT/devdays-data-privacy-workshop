[SERVICE]
    Flush        0.2
    Grace        1
    Log_Level    error
    Parsers_File /fluent-bit/workshop/parsers.conf

[INPUT]
    Name           tail
    Tag            app.hr
    Path           /fluent-bit/tests/native.jsonl
    Parser         workshop_json
    Read_From_Head On
    Exit_On_Eof    On

@INCLUDE /fluent-bit/workshop/privacy-filters.conf

[OUTPUT]
    Name   stdout
    Match  app.*
    Format json_lines
